[project]
name = "freecad-mcp"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.26.0,<2",
    "typing-extensions>=4.12",
    "validators>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "hatchling",
    "editables>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-cov>=5.0",
    "jsonschema>=4.20",
    "mypy==2.3.1",
    "pyside6>=6.5",
    "ruff>=0.9",
]

[project.scripts]
freecad-mcp = "freecad_mcp.server:main"

[tool.hatch.build.targets.sdist]
exclude = ["assets", "results"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
# Put the package root on sys.path so `from tests.helpers...` resolves during
# collection. Importlib mode also keeps same-named root/e2e modules distinct
# when FreeCAD is installed and both files are collectible. `tests` has no
# __init__.py, so it is imported as a namespace package from this root.
pythonpath = ["."]
markers = [
    "unit: mock-based tests that do not require a FreeCAD install (fast, run anywhere)",
    "e2e: live tests that drive a real headless FreeCAD (FreeCADCmd) inside Docker",
    "core: tests reproducing FreeCAD core C++ behavior (placement/attacher/sketcher/pad)",
    "session_e2e: opt-in throwaway-profile session recovery / soak (not part of MARKER=e2e)",
    "benchmark: reproducible end-to-end task and KPI benchmark suite",
    "integration: real-subprocess tests against sibling monorepo tools (e.g. freecad-git CLI), no mocks",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
namespace_packages = true
follow_imports = "skip"
warn_unused_ignores = true
mypy_path = [".", "src"]
# Typed slice entrypoints: contracts and typecheck protocols auto-include new ops.
# Leaves and mutations are pulled via follow_imports=normal on cad_methods_ops.*.
# Public MCP adapters keep follow_imports=silent so CallToolResult signatures
# are visible to typecheck protocols without reporting adapter-internal errors.
files = [
    "addon/FreeCADMCP/_shared/protocol/*_contract.py",
    "src/freecad_mcp/_shared/protocol/*_contract.py",
    "addon/FreeCADMCP/collaboration_api.py",
    "addon/FreeCADMCP/rpc_server/methods/cad_methods_ops/cad_dependencies.py",
    "addon/FreeCADMCP/rpc_server/methods/lease_methods_ops/collaboration_dependencies.py",
    "src/freecad_mcp/freecad_client.py",
    "src/freecad_mcp/freecad_client_ops/freecad_connection.py",
    "tests/typecheck/*_protocol.py",
]

[[tool.mypy.overrides]]
module = [
    "addon.FreeCADMCP._shared.protocol.*",
    "freecad_mcp._shared.protocol.*",
    "addon.FreeCADMCP.collaboration_api",
    "addon.FreeCADMCP.rpc_server.methods.cad_methods_ops.*",
    "addon.FreeCADMCP.rpc_server.methods.lease_methods_ops.collaboration_dependencies",
    "freecad_mcp.freecad_client",
    "freecad_mcp.freecad_client_ops.freecad_connection",
    "tests.typecheck.*",
]
follow_imports = "normal"
disallow_any_unimported = true

[[tool.mypy.overrides]]
module = ["freecad_mcp.responses.tool_results", "freecad_mcp.responses.constants"]
follow_imports = "normal"

[[tool.mypy.overrides]]
module = ["mcp.types"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["freecad_mcp.operations.parametric_ops.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "addon.FreeCADMCP._shared.protocol.*",
    "freecad_mcp._shared.protocol.*",
    "addon.FreeCADMCP.rpc_server.methods.cad_methods_ops.*",
    "freecad_mcp.operations.parametric_ops.*",
]
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = [
    "addon.FreeCADMCP.rpc_server.methods.cad_methods_ops.cad_dependencies",
    "addon.FreeCADMCP.rpc_server.methods.cad_methods_ops.cad_mutation",
]
disallow_any_explicit = false

[[tool.mypy.overrides]]
module = [
    "freecad_mcp.operations.parametric_ops.helpers",
    "freecad_mcp.operations.parametric_ops.sketch_attach_helpers",
]
disallow_any_explicit = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
